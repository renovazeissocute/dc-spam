<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord Multi-Channel Sender</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d0e12;
      --surface: #13151c;
      --card:    #1a1d27;
      --card2:   #20232f;
      --border:  #2a2d3a;
      --accent:  #5865f2;
      --accent2: #7289da;
      --green:   #23a55a;
      --red:     #ed4245;
      --muted:   #72767d;
      --text:    #e3e5e8;
      --radius:  12px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 16px 80px;
    }

    /* ── Header ── */
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .logo {
      width: 48px; height: 48px; background: var(--accent);
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 24px;
      box-shadow: 0 0 28px rgba(88,101,242,.5);
    }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
    .header p  { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .wrap { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Generic card ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

    /* ── Inputs ── */
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .3px; }
    input, textarea, select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 13px; padding: 9px 12px; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    input[type="password"] { letter-spacing: 3px; }
    textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

    /* ── Buttons ── */
    .btn {
      border: none; border-radius: 8px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 13px; padding: 9px 18px;
      transition: all .15s; white-space: nowrap;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: #4752c4; box-shadow: 0 4px 14px rgba(88,101,242,.4); }
    .btn-danger  { background: var(--red); color: #fff; }
    .btn-danger:not(:disabled):hover  { background: #c03537; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:not(:disabled):hover { background: #1a8a47; }
    .btn-ghost { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { color: var(--text); border-color: var(--accent); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }

    /* ── Global controls ── */
    .global-ctrl { display: flex; gap: 10px; flex-wrap: wrap; }
    .global-ctrl .btn { flex: 1; min-width: 130px; }

    /* ── Task list ── */
    #taskList { display: flex; flex-direction: column; gap: 12px; }

    /* ── Task card ── */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }

    .task-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    .task-head:hover { background: #252837; }

    .task-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0; transition: background .3s;
    }
    .task-dot.running { background: var(--green); box-shadow: 0 0 7px var(--green); animation: pulse 1.5s infinite; }
    .task-dot.error   { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .task-name { font-size: 13px; font-weight: 600; flex: 1; }
    .task-meta { font-size: 11px; color: var(--muted); }
    .task-sent { font-size: 13px; font-weight: 700; color: var(--accent2); min-width: 30px; text-align: right; }
    .task-chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
    .task-card.collapsed .task-chevron { transform: rotate(-90deg); }

    .task-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .task-card.collapsed .task-body { display: none; }

    /* ── Msg pool ── */
    .msg-pool { display: flex; flex-direction: column; gap: 6px; }
    .msg-row {
      display: flex; align-items: flex-start; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 10px;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
    .msg-row .msg-txt { flex: 1; font-size: 13px; word-break: break-word; }
    .msg-row .del-msg { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px; transition: color .15s; padding: 0 2px; }
    .msg-row .del-msg:hover { color: var(--red); }

    .add-msg-bar { display: flex; gap: 8px; align-items: flex-end; }
    .add-msg-bar textarea { min-height: 38px; height: 38px; flex: 1; }

    /* ── Interval row ── */
    .interval-row { display: flex; gap: 8px; align-items: center; }
    .interval-row input  { flex: 1; }
    .interval-row select { width: 100px; flex: none; }

    /* ── Toggle ── */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .tog { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .tog input { display: none; }
    .tog-track { width: 38px; height: 21px; background: var(--border); border-radius: 11px; transition: background .2s; }
    .tog input:checked ~ .tog-track { background: var(--green); }
    .tog-thumb { position: absolute; left: 3px; top: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .2s; }
    .tog input:checked ~ .tog-thumb { left: 20px; }

    /* ── Task controls ── */
    .task-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
    .task-ctrl .btn { flex: 1; min-width: 90px; text-align: center; }

    /* ── Status bar ── */
    .global-status {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .g-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .g-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }

    /* ── Log ── */
    .log-box {
      background: #090a0e; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      max-height: 200px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 11.5px; line-height: 1.65;
    }
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .log-entry { display: flex; gap: 8px; }
    .log-time  { color: var(--muted); flex-shrink: 0; }
    .log-ok    { color: var(--green); }
    .log-err   { color: var(--red); }
    .log-info  { color: var(--accent2); }
    .log-tag   { color: #a78bfa; flex-shrink: 0; }

    .row2 { display: flex; gap: 10px; }
    .row2 > * { flex: 1; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🤖</div>
  <div>
    <h1>Discord Multi-Channel Sender</h1>
    <p>User token · multiple independent channel tasks</p>
  </div>
</div>

<div class="wrap">

  <!-- Token -->
  <div class="card">
    <div class="card-title">🔐 Authentication (shared)</div>
    <label for="tokenInput">User Token</label>
    <input type="password" id="tokenInput" placeholder="paste your Discord user token…"/>
    <div style="margin-top:7px;font-size:11px;color:var(--muted);">
      DevTools → Network → any Discord request → Headers → <code style="color:var(--accent2)">authorization</code>
    </div>
  </div>

  <!-- Global controls -->
  <div class="global-ctrl">
    <button class="btn btn-success" onclick="startAll()">▶▶ Start All</button>
    <button class="btn btn-danger"  onclick="stopAll()">⏹ Stop All</button>
    <button class="btn btn-primary" onclick="addTask()">＋ Add Channel</button>
    <button class="btn btn-ghost btn-sm" onclick="clearLog()">Clear log</button>
  </div>

  <!-- Global status -->
  <div class="global-status">
    <div class="g-dot" id="gDot"></div>
    <div style="flex:1; font-size:13px;">
      <strong id="gStatusText">Idle</strong>
      <span id="gStatusSub" style="color:var(--muted);font-size:11px;display:block;">No tasks running</span>
    </div>
    <div style="font-size:20px;font-weight:700;color:var(--accent2);" id="gTotal">0</div>
    <span style="font-size:11px;color:var(--muted);">total sent</span>
  </div>

  <!-- Task list -->
  <div id="taskList"></div>

  <!-- Log -->
  <div class="card" style="padding:16px;">
    <div class="card-title">📋 Log</div>
    <div class="log-box" id="logBox">
      <div class="log-entry"><span class="log-time">--:--:--</span><span class="log-info">Ready. Add a channel task above.</span></div>
    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────
let tasks = {}; // id -> task object
let taskIdCounter = 0;

const COLORS = ['#a78bfa','#60a5fa','#34d399','#f97316','#f43f5e','#facc15','#22d3ee','#e879f9'];

function newTask() {
  const id = ++taskIdCounter;
  return {
    id,
    name: 'Channel ' + id,
    color: COLORS[(id - 1) % COLORS.length],
    channelId: '',
    messages: [],
    msgIndex: 0,
    mode: 'sequential',   // 'sequential' | 'random'
    intervalVal: 5,
    intervalUnit: 1000,   // ms multiplier
    jitter: false,
    running: false,
    timer: null,
    sentCount: 0,
  };
}

// ── Render ─────────────────────────────────────────────────
function renderTask(t) {
  const list = document.getElementById('taskList');
  const existing = document.getElementById('task-' + t.id);
  const el = document.createElement('div');
  el.className = 'task-card';
  el.id = 'task-' + t.id;

  el.innerHTML =
    '<div class="task-head" onclick="toggleCollapse(' + t.id + ')">' +
      '<div class="task-dot" id="dot-' + t.id + '"></div>' +
      '<span class="task-name" style="color:' + t.color + '">' + escHtml(t.name) + '</span>' +
      '<span class="task-meta" id="meta-' + t.id + '">—</span>' +
      '<span class="task-sent" id="sent-' + t.id + '">' + t.sentCount + '</span>' +
      '<span style="font-size:10px;color:var(--muted);margin-left:4px;">sent</span>' +
      '<span class="task-chevron">▾</span>' +
    '</div>' +
    '<div class="task-body">' +
      /* channel id + name row */
      '<div class="row2">' +
        '<div>' +
          '<label>Channel ID</label>' +
          '<input type="text" id="ch-' + t.id + '" placeholder="123456789…" value="' + escHtml(t.channelId) + '" oninput="syncField(' + t.id + ',\'channelId\',this.value)"/>' +
        '</div>' +
        '<div>' +
          '<label>Task Name</label>' +
          '<input type="text" id="name-' + t.id + '" value="' + escHtml(t.name) + '" oninput="syncName(' + t.id + ',this.value)"/>' +
        '</div>' +
      '</div>' +

      /* message pool */
      '<div>' +
        '<label>Message Pool &nbsp;<span style="color:var(--muted);font-weight:400;">(' +
          (t.mode === 'random' ? 'Random' : 'Sequential') + ')</span></label>' +
        '<div class="msg-pool" id="pool-' + t.id + '"></div>' +
        '<div class="add-msg-bar" style="margin-top:8px;">' +
          '<textarea id="newmsg-' + t.id + '" placeholder="Type message… Enter to add" onkeydown="msgEnter(event,' + t.id + ')"></textarea>' +
          '<button class="btn btn-primary btn-sm" onclick="addMsg(' + t.id + ')">＋</button>' +
        '</div>' +
        '<div class="toggle-row" style="margin-top:10px;">' +
          '<span style="font-size:12px;color:var(--muted);">Mode: <strong id="modelabel-' + t.id + '" style="color:var(--text);">' + (t.mode === 'random' ? 'Random' : 'Sequential') + '</strong></span>' +
          '<label class="tog"><input type="checkbox" id="modetog-' + t.id + '" ' + (t.mode === 'random' ? 'checked' : '') + ' onchange="toggleMode(' + t.id + ')"/><div class="tog-track"></div><div class="tog-thumb"></div></label>' +
          '<span style="font-size:12px;color:var(--muted);">Random</span>' +
        '</div>' +
      '</div>' +

      /* interval */
      '<div>' +
        '<label>Interval</label>' +
        '<div class="interval-row">' +
          '<input type="number" id="ival-' + t.id + '" value="' + t.intervalVal + '" min="1" oninput="syncField(' + t.id + ',\'intervalVal\',+this.value)"/>' +
          '<select id="iunit-' + t.id + '" onchange="syncField(' + t.id + ',\'intervalUnit\',+this.value)">' +
            '<option value="1000"' + (t.intervalUnit===1000?' selected':'') + '>Seconds</option>' +
            '<option value="60000"' + (t.intervalUnit===60000?' selected':'') + '>Minutes</option>' +
            '<option value="3600000"' + (t.intervalUnit===3600000?' selected':'') + '>Hours</option>' +
          '</select>' +
        '</div>' +
        '<div class="toggle-row" style="margin-top:10px;">' +
          '<span style="font-size:12px;">Jitter <span style="color:var(--muted);">(±30%)</span></span>' +
          '<label class="tog"><input type="checkbox" id="jittog-' + t.id + '" ' + (t.jitter ? 'checked' : '') + ' onchange="syncField(' + t.id + ',\'jitter\',this.checked)"/><div class="tog-track"></div><div class="tog-thumb"></div></label>' +
        '</div>' +
      '</div>' +

      /* task controls */
      '<div class="task-ctrl">' +
        '<button class="btn btn-success btn-sm" id="startbtn-' + t.id + '" onclick="startTask(' + t.id + ')">▶ Start</button>' +
        '<button class="btn btn-danger btn-sm"  id="stopbtn-' + t.id + '"  onclick="stopTask(' + t.id + ')" disabled>⏹ Stop</button>' +
        '<button class="btn btn-ghost btn-xs"   onclick="removeTask(' + t.id + ')">✕ Remove</button>' +
      '</div>' +
    '</div>';

  if (existing) {
    list.replaceChild(el, existing);
  } else {
    list.appendChild(el);
  }

  renderPool(t);
}

function renderPool(t) {
  const pool = document.getElementById('pool-' + t.id);
  if (!pool) return;
  pool.innerHTML = '';
  if (t.messages.length === 0) {
    pool.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:4px 0;">No messages yet</div>';
    return;
  }
  t.messages.forEach(function(m, i) {
    var div = document.createElement('div');
    div.className = 'msg-row';
    div.innerHTML = '<span class="msg-txt">' + escHtml(m) + '</span>' +
      '<button class="del-msg" onclick="delMsg(' + t.id + ',' + i + ')">✕</button>';
    pool.appendChild(div);
  });
}

function toggleCollapse(id) {
  var card = document.getElementById('task-' + id);
  card.classList.toggle('collapsed');
}

// ── Field sync ────────────────────────────────────────────
function syncField(id, field, val) { tasks[id][field] = val; }

function syncName(id, val) {
  tasks[id].name = val;
  var span = document.querySelector('#task-' + id + ' .task-name');
  if (span) span.textContent = val;
}

function toggleMode(id) {
  var t = tasks[id];
  t.mode = document.getElementById('modetog-' + id).checked ? 'random' : 'sequential';
  var lbl = document.getElementById('modelabel-' + id);
  if (lbl) lbl.textContent = t.mode === 'random' ? 'Random' : 'Sequential';
}

// ── Messages ──────────────────────────────────────────────
function addMsg(id) {
  var inp = document.getElementById('newmsg-' + id);
  var txt = inp.value.trim();
  if (!txt) return;
  tasks[id].messages.push(txt);
  inp.value = '';
  renderPool(tasks[id]);
}

function msgEnter(e, id) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addMsg(id); }
}

function delMsg(id, i) {
  tasks[id].messages.splice(i, 1);
  if (tasks[id].msgIndex >= tasks[id].messages.length) tasks[id].msgIndex = 0;
  renderPool(tasks[id]);
}

// ── Task add/remove ───────────────────────────────────────
function addTask() {
  var t = newTask();
  tasks[t.id] = t;
  renderTask(t);
  log('Task "' + t.name + '" added', 'info', t);
}

function removeTask(id) {
  stopTask(id);
  var el = document.getElementById('task-' + id);
  if (el) el.remove();
  delete tasks[id];
  updateGlobalStatus();
}

// ── Sending ───────────────────────────────────────────────
function getToken() {
  return document.getElementById('tokenInput').value.trim();
}

async function doSend(t) {
  var token = getToken();
  var content = pickMsg(t);
  if (!content) { log('No messages in pool', 'err', t); return; }

  try {
    var res = await fetch('https://discord.com/api/v9/channels/' + t.channelId + '/messages', {
      method: 'POST',
      headers: {
        'Authorization': token,
        'Content-Type': 'application/json',
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0',
      },
      body: JSON.stringify({ content: content })
    });

    if (res.status === 429) {
      var data = await res.json().catch(function(){ return {}; });
      var retry = data.retry_after || 1;
      throw new Error('Rate limited — retry after ' + retry.toFixed(1) + 's');
    }
    if (!res.ok) {
      var data2 = await res.json().catch(function(){ return {}; });
      throw new Error('HTTP ' + res.status + ': ' + (data2.message || res.statusText));
    }

    t.sentCount++;
    var el = document.getElementById('sent-' + t.id);
    if (el) el.textContent = t.sentCount;
    log('Sent: "' + (content.length > 55 ? content.slice(0,52) + '…' : content) + '"', 'ok', t);
    updateGlobalStatus();

  } catch(e) {
    log(e.message, 'err', t);
    setTaskStatus(t, 'error');
  }
}

function pickMsg(t) {
  if (t.messages.length === 0) return null;
  if (t.mode === 'random') return t.messages[Math.floor(Math.random() * t.messages.length)];
  var m = t.messages[t.msgIndex % t.messages.length];
  t.msgIndex++;
  return m;
}

function getMs(t) {
  var ms = t.intervalVal * t.intervalUnit;
  if (t.jitter) ms += (Math.random() * 2 - 1) * ms * 0.3;
  return Math.max(ms, 500);
}

function scheduleNext(t) {
  if (!t.running) return;
  t.timer = setTimeout(async function() {
    if (!t.running) return;
    await doSend(t);
    scheduleNext(t);
  }, getMs(t));
}

function startTask(id) {
  var t = tasks[id];
  if (!t) return;
  var token = getToken();
  if (!token)           { log('Token is empty!', 'err', t); return; }
  if (!t.channelId)     { log('Channel ID is empty!', 'err', t); return; }
  if (!t.messages.length){ log('No messages in pool!', 'err', t); return; }

  t.running = true;
  t.sentCount = 0;
  t.msgIndex  = 0;
  var el = document.getElementById('sent-' + t.id);
  if (el) el.textContent = '0';

  document.getElementById('startbtn-' + t.id).disabled = true;
  document.getElementById('stopbtn-'  + t.id).disabled = false;
  setTaskStatus(t, 'running');

  var unitLabel = {1000:'s', 60000:'m', 3600000:'h'}[t.intervalUnit] || 's';
  log('Started — interval ~' + t.intervalVal + unitLabel + (t.jitter ? ' ±jitter' : ''), 'info', t);

  // first send nearly immediately
  t.timer = setTimeout(async function() {
    await doSend(t);
    scheduleNext(t);
  }, 150);

  updateGlobalStatus();
}

function stopTask(id) {
  var t = tasks[id];
  if (!t) return;
  clearTimeout(t.timer);
  t.timer = null;
  t.running = false;

  var sb = document.getElementById('startbtn-' + id);
  var stb = document.getElementById('stopbtn-' + id);
  if (sb)  sb.disabled  = false;
  if (stb) stb.disabled = true;
  setTaskStatus(t, 'idle');
  log('Stopped. Sent: ' + t.sentCount, 'info', t);
  updateGlobalStatus();
}

function startAll() {
  Object.values(tasks).forEach(function(t) {
    if (!t.running) startTask(t.id);
  });
}

function stopAll() {
  Object.values(tasks).forEach(function(t) {
    if (t.running) stopTask(t.id);
  });
}

function setTaskStatus(t, state) {
  var dot = document.getElementById('dot-' + t.id);
  var meta = document.getElementById('meta-' + t.id);
  if (!dot) return;
  dot.className = 'task-dot' + (state === 'running' ? ' running' : state === 'error' ? ' error' : '');
  if (meta) meta.textContent = state === 'running' ? '● live' : state === 'error' ? '✕ error' : '—';
}

function updateGlobalStatus() {
  var running = Object.values(tasks).filter(function(t){ return t.running; }).length;
  var total   = Object.values(tasks).reduce(function(a,t){ return a + t.sentCount; }, 0);
  var dot = document.getElementById('gDot');
  dot.className = 'g-dot' + (running > 0 ? ' active' : '');
  document.getElementById('gStatusText').textContent = running > 0 ? running + ' task' + (running > 1 ? 's' : '') + ' running' : 'Idle';
  document.getElementById('gStatusSub').textContent  = Object.keys(tasks).length + ' channel' + (Object.keys(tasks).length !== 1 ? 's' : '') + ' configured';
  document.getElementById('gTotal').textContent = total;
}

// ── Log ───────────────────────────────────────────────────
function log(msg, type, task) {
  var box = document.getElementById('logBox');
  var now = new Date().toLocaleTimeString('en-GB');
  var div = document.createElement('div');
  div.className = 'log-entry';
  var tag = task ? '<span class="log-tag" style="color:' + task.color + '">[' + escHtml(task.name) + ']</span>' : '';
  div.innerHTML = '<span class="log-time">' + now + '</span>' + tag + '<span class="log-' + (type||'info') + '">' + escHtml(String(msg)) + '</span>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function clearLog() {
  document.getElementById('logBox').innerHTML =
    '<div class="log-entry"><span class="log-time">--:--:--</span><span class="log-info">Log cleared.</span></div>';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// init with one task
addTask();
</script>
